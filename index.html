<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>MIMICme</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="bg"></canvas>

    <!-- ===== HOME ===== -->
    <section id="screen-home" class="screen active">
      <h1 class="logo">MIMIC<span>me</span></h1>
      <button id="btn-start" class="big primary">START</button>
      <div class="row">
        <button id="btn-camera" class="toggle">Camera: OFF</button>
        <button id="btn-sound" class="toggle">Sound: ON</button>
      </div>
      <button id="btn-reset" class="ghost">Reset progress</button>
      <button id="btn-export" class="ghost">Export session</button>
      <div id="home-status" class="tiny">Loading...</div>
      <button id="btn-dev" class="ghost" hidden>Developer tools</button>
    </section>

    <!-- ===== GAME MODES ===== -->
    <section id="screen-modes" class="screen">
      <button class="back" data-back="home">&larr; Back</button>
      <h2>Game Modes</h2>
      <button id="mode-campaign" class="big">Campaign</button>
      <button id="mode-arcade" class="big">Arcade</button>
      <button id="mode-practice" class="big">Practice</button>
      <div id="modes-note" class="tiny"></div>
      <button id="btn-calibrate" class="ghost">
        Recalibrate fingers (left, then right)
      </button>
    </section>

    <!-- ===== CAMPAIGN LEVEL SELECT ===== -->
    <section id="screen-campaign" class="screen">
      <button class="back" data-back="modes">&larr; Back</button>
      <h2>Difficulty</h2>
      <div id="tiers"></div>
    </section>

    <!-- ===== PLAY (campaign level, arcade, practice, calibration, dev capture) ===== -->
    <section id="screen-play" class="screen">
      <header class="play-top">
        <button id="btn-play-back" class="back">&larr; Back</button>
        <div id="play-title">MIMICme</div>
        <div id="play-status" class="tiny"></div>
      </header>

      <div class="play-layout">
        <div id="stage-wrap">
          <div id="stage">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
            <canvas id="target-canvas" width="640" height="480"></canvas>
            <div id="time-track" data-show="campaign arcade dev">
              <div id="time-fill"></div>
            </div>
            <div id="hud">
              <div id="target-name"></div>
              <div id="hand-hint"></div>
            </div>
            <div id="score-chip" data-show="campaign arcade practice dev">
              <span id="score-value">--</span>
            </div>
            <div id="result"></div>
            <div id="hold-track"><div id="hold-fill"></div></div>
            <div id="agent-message"></div>
            <div id="end-panel" hidden>
              <div id="end-title"></div>
              <div class="row">
                <button id="end-retry">Retry</button>
                <button id="end-next" class="primary">Next level</button>
                <button id="end-levels">Levels</button>
              </div>
            </div>
          </div>
        </div>

        <aside id="side">
          <div class="panel" data-show="campaign">
            <div id="level-info">Level</div>
            <div class="tiny">
              Match the target and hold it steady. The bar at the top is your
              time.
            </div>
          </div>

          <div class="panel" data-show="arcade practice">
            <div class="row small">
              <span>Points <b id="points">0</b></span>
              <span>Streak <b id="streak">0</b></span>
              <span>Accuracy <b id="accuracy">--</b></span>
              <span>Cleared <b id="cleared">0</b></span>
            </div>
          </div>

          <div class="panel" data-show="practice">
            <div class="row">
              <button id="prac-prev">&larr; Prev pose</button>
              <button id="prac-next">Next pose &rarr;</button>
            </div>
          </div>

          <div class="panel" data-show="campaign arcade practice">
            <div class="sub">Live finger match</div>
            <div id="live-bars"></div>
          </div>

          <div class="panel" data-show="arcade practice">
            <div class="sub">Finger weakness (agent's estimate)</div>
            <div id="weak-text" class="tiny"></div>
            <div id="weak-bars"></div>
          </div>

          <div class="panel" data-show="dev">
            <div class="sub">Developer: capture poses</div>
            <select id="pose-select"></select>
            <label
              >Hand used for this capture
              <select id="hand-select">
                <option value="right">Right hand</option>
                <option value="left">Left hand</option>
              </select>
            </label>
            <div class="row">
              <button id="btn-capture">Capture (3s)</button>
              <button id="btn-export-poses">Export poses.json</button>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <div id="toast"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
